name: Firmware bauen und Webflash veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO und esptool installieren
        run: pip install platformio "esptool>=5"

      - name: Beide Varianten kompilieren
        run: pio run -e oled-grau -e oled-farbig

      - name: Je ein Gesamt-Image für den Webflasher erzeugen
        run: |
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -n 1)
          mkdir -p docs/firmware
          for ENV in oled-grau oled-farbig; do
            B=.pio/build/$ENV
            esptool --chip esp32h2 merge-bin \
              -o docs/firmware/creepereyes-esp32h2-$ENV.bin \
              --flash-mode dio --flash-size 4MB \
              0x0     $B/bootloader.bin \
              0x8000  $B/partitions.bin \
              0xe000  "$BOOT_APP0" \
              0x10000 $B/firmware.bin
          done
          ls -l docs/firmware

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
