; CreeperEyes – Port für Waveshare ESP32-H2-DEV-KIT-N4
; Zwei Varianten: graues 1.5inch OLED (SSD1327) und farbiges 1.5inch RGB OLED (SSD1351)

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-h2-devkitm-1
framework = arduino
monitor_speed = 115200

[env:oled-grau]
build_flags = -DOLED_SSD1327
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1327@^1.0.0

[env:oled-farbig]
build_flags = -DOLED_SSD1351
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1351 library@^1.2.8
